name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1. Node 22's bundled npm may be older.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}. Refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json ${pkg}"

      - run: npm run check:package

      - name: Generate CycloneDX SBOM
        run: npm exec -- cyclonedx-npm --omit dev --mc-type library --output-reproducible --validate --output-file sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      # OIDC trusted publishing. Do not set NODE_AUTH_TOKEN.
      # Provenance is also generated automatically for trusted publishes from a public repo;
      # --provenance is passed explicitly so the attestation is requested either way.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" sbom.cdx.json \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
