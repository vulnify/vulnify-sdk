<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">How a Vulnify decision works</title>
  <desc id="desc">An agent action is checked before it runs. Vulnify returns ALLOW, REVIEW, or BLOCK.</desc>
  <rect width="960" height="220" rx="16" fill="#06080F"/>
  <rect x="36" y="70" width="200" height="80" rx="12" fill="#0B1F4B" stroke="rgba(244,246,248,0.12)"/>
  <text x="136" y="106" text-anchor="middle" fill="#F4F6F8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Agent action</text>
  <text x="136" y="128" text-anchor="middle" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">metadata only</text>
  <path d="M248 110 H308" stroke="#3D6DFF" stroke-width="2" fill="none"/>
  <path d="M300 104 L312 110 L300 116" stroke="#3D6DFF" stroke-width="2" fill="none"/>
  <rect x="320" y="70" width="200" height="80" rx="12" fill="#0B1F4B" stroke="#3D6DFF"/>
  <text x="420" y="106" text-anchor="middle" fill="#F4F6F8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">check()</text>
  <text x="420" y="128" text-anchor="middle" fill="#B7C0CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">before it runs</text>
  <path d="M532 110 H592" stroke="#3D6DFF" stroke-width="2" fill="none"/>
  <path d="M584 104 L596 110 L584 116" stroke="#3D6DFF" stroke-width="2" fill="none"/>
  <rect x="608" y="24" width="316" height="48" rx="10" fill="#12261A" stroke="#9DDEC0"/>
  <text x="766" y="53" text-anchor="middle" fill="#9DDEC0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ALLOW  run the action</text>
  <rect x="608" y="86" width="316" height="48" rx="10" fill="#2A2414" stroke="#E6C98A"/>
  <text x="766" y="115" text-anchor="middle" fill="#E6C98A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">REVIEW  wait for a person</text>
  <rect x="608" y="148" width="316" height="48" rx="10" fill="#2C1818" stroke="#F0B2AC"/>
  <text x="766" y="177" text-anchor="middle" fill="#F0B2AC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">BLOCK  do not run it</text>
</svg>
